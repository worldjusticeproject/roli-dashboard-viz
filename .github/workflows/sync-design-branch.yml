name: Sync design branch with main

# Trigger: Runs every time main is updated
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Ensure only one sync runs at a time to prevent race conditions
concurrency:
  group: sync-design-branch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required to push to branches

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync design branch
        run: |
          # Fetch all latest changes
          git fetch --prune origin

          # GitHub can delete the source branch after a PR is merged.
          # Recreate the shared design branch from main when that happens.
          if ! git show-ref --verify --quiet refs/remotes/origin/design; then
            git push origin refs/remotes/origin/main:refs/heads/design
            echo "Recreated design from main."
            exit 0
          fi

          # Check if design and main are already identical
          if git merge-base --is-ancestor origin/main origin/design; then
            echo "✅ Branches are already in sync. Nothing to do."
            exit 0
          fi

          # Checkout design branch
          git checkout design
          git pull origin design --rebase

          # Try fast-forward first (no merge commit)
          if git merge --ff-only origin/main 2>/dev/null; then
            echo "✅ Fast-forward successful - no merge commit created"
          else
            # If design has unique commits, do regular merge
            git merge origin/main -m "Auto-sync: Merge main into design"
            echo "✅ Merge commit created (design had unique commits)"
          fi

          # Push only if there are changes
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/design)" ]; then
            git push origin design
            echo "✅ Pushed to design"
          else
            echo "ℹ️ No changes to push"
          fi

      - name: Comment on PR if sync fails
        if: failure()
        run: |
          echo "⚠️ Auto-sync from main to design failed. Manual merge required."
          echo "This usually means there are merge conflicts that need human review."
